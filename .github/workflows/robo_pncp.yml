name: Robô PNCP Monitoramento Eletrônico

on:
  schedule:
    # Roda de segunda a sexta às 08:00 (horário de Brasília)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Permite rodar manualmente quando quiser

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar Varredura no PNCP
        env:
          EMAIL_DESTINO: "seu-email@suaempresa.com.br" # Coloque seu e-mail aqui
        run: python script_pncp.py
